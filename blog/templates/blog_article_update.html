{% extends '..\..\catalog\templates\base.html' %}

{% block content %}

{% include '..\..\catalog\templates\main_menu.html' %}

<div class="container mt-5">
    <h1 class="mb-4">Редактирование {{ article.title }}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'blog:article_detail' pk=article.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>

{% endblock %}
