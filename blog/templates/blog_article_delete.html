blog_article_detail.html{% extends '..\..\catalog\templates\base.html' %}

{% block content %}

{% include '..\..\catalog\templates\main_menu.html' %}

<div class="container mt-5">
    <h1 class="mb-4">Удаление статьи</h1>
    <p>Вы уверены, что хотите удалить "{{ article.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'blog:blog_main' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>

{% endblock %}
